name: Trix AI - Diagnostic Android Build

on:
  push:
    branches: ["main"]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Find and extract workspace ZIP
        shell: bash
        run: |
          set -e
          ZIP_FILE="$(find . -maxdepth 1 -type f -name 'workspace-*.zip' -print -quit)"
          if [ -z "$ZIP_FILE" ]; then
            ZIP_FILE="$(find . -maxdepth 1 -type f -name '*.zip' -print -quit)"
          fi
          if [ -z "$ZIP_FILE" ]; then
            echo "::error::No workspace ZIP found in repository root."
            exit 1
          fi
          echo "Using: $ZIP_FILE"
          rm -rf workspace
          mkdir -p workspace
          unzip -q "$ZIP_FILE" -d workspace

      - name: Locate TrixAI project
        shell: bash
        run: |
          set -e
          PROJECT_DIR="$(find workspace -type f -name 'settings.gradle.kts' -print | head -1 | sed 's#/settings.gradle.kts##')"
          if [ -z "$PROJECT_DIR" ]; then
            PROJECT_DIR="$(find workspace -type f -name 'settings.gradle' -print | head -1 | sed 's#/settings.gradle##')"
          fi
          if [ -z "$PROJECT_DIR" ]; then
            echo "::error::settings.gradle(.kts) not found."
            exit 1
          fi
          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"
          echo "Using project: $PROJECT_DIR"

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle 8.2
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.2"

      - name: Build debug APK and expose real compiler error
        shell: bash
        run: |
          set +e
          gradle --no-daemon --stacktrace --console=plain             -p "$PROJECT_DIR" :app:assembleDebug 2>&1 | tee build.log
          STATUS=${PIPESTATUS[0]}

          echo ""
          echo "================ FIRST ERROR MATCHES ================"
          grep -n -E             '(^e: |error:|ERROR|FAILURE:|What went wrong:|Execution failed for|Unresolved reference|Type mismatch|Cannot access|Expecting |Too many arguments|None of the following functions)'             build.log | head -80 || true

          echo ""
          echo "================ LAST 120 LINES ================"
          tail -120 build.log

          exit "$STATUS"

      - name: Upload build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Trix-AI-build-log
          path: build.log
          if-no-files-found: ignore

      - name: Upload APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: Trix-AI-debug
          path: ${{ env.PROJECT_DIR }}/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
