name: Trix AI - Build APK

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build debug APK
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Locate and extract Trix AI workspace ZIP
        shell: bash
        run: |
          set -euo pipefail

          ZIP=""
          if [ -f "TrixAI-workspace-Fixed-v3.zip" ]; then
            ZIP="TrixAI-workspace-Fixed-v3.zip"
          else
            ZIP="$(find . -maxdepth 2 -type f -name 'TrixAI-workspace-Fixed*.zip' | head -n 1 || true)"
          fi

          if [ -z "$ZIP" ]; then
            echo "::error::TrixAI workspace ZIP was not found."
            echo "ZIP files in repository:"
            find . -maxdepth 3 -type f -name '*.zip' -print
            exit 1
          fi

          echo "Using ZIP: $ZIP"
          rm -rf "$GITHUB_WORKSPACE/workspace"
          mkdir -p "$GITHUB_WORKSPACE/workspace"
          unzip -q "$ZIP" -d "$GITHUB_WORKSPACE/workspace"

          echo "Searching for settings.gradle.kts..."
          SETTINGS="$(find "$GITHUB_WORKSPACE/workspace" -type f -name 'settings.gradle.kts' -print -quit)"
          if [ -z "$SETTINGS" ]; then
            SETTINGS="$(find "$GITHUB_WORKSPACE/workspace" -type f -name 'settings.gradle' -print -quit)"
          fi

          if [ -z "$SETTINGS" ]; then
            echo "::error::settings.gradle(.kts) not found after extracting the ZIP."
            find "$GITHUB_WORKSPACE/workspace" -maxdepth 5 -type f | head -n 200
            exit 1
          fi

          PROJECT_DIR="$(dirname "$SETTINGS")"
          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"
          echo "Found Android project at: $PROJECT_DIR"

          echo "Project files:"
          ls -la "$PROJECT_DIR"

          if [ ! -d "$PROJECT_DIR/app" ]; then
            echo "::error::Android app module not found at $PROJECT_DIR/app"
            exit 1
          fi

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle 8.2
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.2'

      - name: Verify Android project
        shell: bash
        run: |
          set -euo pipefail
          cd "$PROJECT_DIR"

          echo "Java:"
          java -version

          echo "Gradle:"
          gradle --version

          echo "settings.gradle.kts:"
          sed -n '1,160p' settings.gradle.kts

          echo "app/build.gradle.kts:"
          sed -n '1,220p' app/build.gradle.kts

      - name: Build debug APK
        shell: bash
        run: |
          set -o pipefail
          cd "$PROJECT_DIR"

          gradle \
            --no-daemon \
            --stacktrace \
            --console=plain \
            :app:assembleDebug 2>&1 | tee "$GITHUB_WORKSPACE/build.log"

      - name: Show build error summary
        if: failure()
        shell: bash
        run: |
          echo "================ BUILD ERROR SUMMARY ================"
          if [ -f "$GITHUB_WORKSPACE/build.log" ]; then
            grep -n -E \
              '(^e: |error:|ERROR|FAILURE:|What went wrong:|Execution failed for|Unresolved reference|Type mismatch|Cannot access|Expecting |Too many arguments|None of the following functions)' \
              "$GITHUB_WORKSPACE/build.log" | tail -n 120 || true

            echo "================ LAST 160 LINES ================"
            tail -n 160 "$GITHUB_WORKSPACE/build.log"
          fi

      - name: Upload build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Trix-AI-build-log
          path: build.log
          if-no-files-found: ignore

      - name: Upload APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: Trix-AI-debug
          path: |
            ${{ env.PROJECT_DIR }}/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
