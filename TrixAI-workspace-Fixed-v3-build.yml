name: Trix AI - Fixed Workspace APK

on:
  workflow_dispatch:
  push:
    branches: ["main"]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Locate and extract the correct Trix AI workspace
        shell: bash
        run: |
          set -euo pipefail
          rm -rf workspace
          mkdir -p workspace

          # Prefer an already extracted Android project if one exists.
          if [ -f "TrixAI/settings.gradle.kts" ]; then
            echo "Found TrixAI project directly in repository."
            cp -a TrixAI workspace/TrixAI
          else
            # Use the known-good workspace ZIP. Do NOT use the tiny v2 ZIP.
            ZIP_FILE=""
            for f in TrixAI-workspace-Fixed-v3.zip TrixAI-workspace-Fixed.zip; do
              if [ -f "$f" ]; then ZIP_FILE="$f"; break; fi
            done

            if [ -z "$ZIP_FILE" ]; then
              echo "::error::Correct Trix AI workspace ZIP was not found. Upload TrixAI-workspace-Fixed-v3.zip to the repository root."
              echo "ZIP files currently present:"
              find . -maxdepth 1 -type f -name '*.zip' -printf '%f\n' | sort
              exit 1
            fi

            echo "Using: $ZIP_FILE"
            unzip -q "$ZIP_FILE" -d workspace
          fi

          if [ ! -f workspace/TrixAI/settings.gradle.kts ]; then
            echo "::error::TrixAI/settings.gradle.kts was not found after extraction."
            echo "Extracted files:"
            find workspace -maxdepth 4 -type f | sort | head -200
            exit 1
          fi

          echo "PROJECT_DIR=$GITHUB_WORKSPACE/workspace/TrixAI" >> "$GITHUB_ENV"

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      - name: Set up Gradle 8.2
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.2"

      - name: Verify Android project
        shell: bash
        run: |
          set -euo pipefail
          echo "Project: $PROJECT_DIR"
          test -f "$PROJECT_DIR/settings.gradle.kts"
          test -f "$PROJECT_DIR/build.gradle.kts"
          test -f "$PROJECT_DIR/app/build.gradle.kts"
          test -f "$PROJECT_DIR/app/src/main/AndroidManifest.xml"
          echo "Android project files OK."

      - name: Build debug APK
        shell: bash
        run: |
          set +e
          gradle --no-daemon --stacktrace --console=plain \
            -p "$PROJECT_DIR" :app:assembleDebug 2>&1 | tee build.log
          STATUS=${PIPESTATUS[0]}

          echo ""
          echo "================ REAL BUILD ERRORS ================"
          grep -n -E '(^e: |error:|ERROR:|AAPT:|FAILURE:|What went wrong:|Execution failed for|Manifest merger failed|Unresolved reference|Type mismatch|Cannot access|Expecting |Too many arguments|None of the following functions)' build.log | head -200 || true

          echo ""
          echo "================ LAST 220 LINES ================"
          tail -220 build.log

          exit "$STATUS"

      - name: Upload build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Trix-AI-build-log
          path: build.log
          if-no-files-found: ignore

      - name: Upload debug APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: Trix-AI-debug
          path: ${{ env.PROJECT_DIR }}/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
