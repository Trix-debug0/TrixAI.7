name: Trix AI - Workspace APK Build

on:
  push:
    branches: ["main"]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Find and extract uploaded workspace ZIP
        shell: bash
        run: |
          set -e

          ZIP_FILE="$(find . -maxdepth 1 -type f -name 'workspace-*.zip' -print -quit)"

          if [ -z "$ZIP_FILE" ]; then
            ZIP_FILE="$(find . -maxdepth 1 -type f -name '*.zip' -print -quit)"
          fi

          if [ -z "$ZIP_FILE" ]; then
            echo "::error::No workspace ZIP found in repository root."
            exit 1
          fi

          echo "Using ZIP: $ZIP_FILE"

          rm -rf workspace
          mkdir -p workspace
          unzip -q "$ZIP_FILE" -d workspace

          echo "Extracted files:"
          find workspace -maxdepth 3 -type f | sort | head -200

      - name: Locate TrixAI Gradle project
        shell: bash
        run: |
          set -e

          if [ -f "workspace/TrixAI/settings.gradle.kts" ]; then
            echo "PROJECT_DIR=workspace/TrixAI" >> "$GITHUB_ENV"
          elif [ -f "workspace/TrixAI/settings.gradle" ]; then
            echo "PROJECT_DIR=workspace/TrixAI" >> "$GITHUB_ENV"
          else
            PROJECT_DIR="$(find workspace -type f \( -name 'settings.gradle.kts' -o -name 'settings.gradle' \) -print | grep '/TrixAI/' | head -1 | sed 's#/settings.gradle.*##')"

            if [ -z "$PROJECT_DIR" ]; then
              echo "::error::Could not find the TrixAI Gradle project."
              exit 1
            fi

            echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"
          fi

          echo "Project directory:"
          cat "$GITHUB_ENV"

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle 8.2
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.2"

      - name: Verify Android project
        shell: bash
        run: |
          set -e
          test -f "$PROJECT_DIR/settings.gradle.kts" -o -f "$PROJECT_DIR/settings.gradle"
          test -f "$PROJECT_DIR/app/build.gradle.kts" -o -f "$PROJECT_DIR/app/build.gradle"

          echo "=== Gradle project ==="
          ls -la "$PROJECT_DIR"
          echo "=== App module ==="
          ls -la "$PROJECT_DIR/app"

      - name: Build debug APK
        shell: bash
        run: |
          set -e
          gradle --no-daemon --stacktrace --console=plain \
            -p "$PROJECT_DIR" :app:assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Trix-AI-debug
          path: ${{ env.PROJECT_DIR }}/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
